<nav class="bg-white border-b border-gray-200 shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo/Brand -->
      <a routerLink="/" class="flex items-center space-x-2">
        <svg
          class="w-8 h-8 text-blue-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        <span class="text-gray-800 text-xl font-bold">HotelBook</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-6">
        <a
          routerLink="/"
          routerLinkActive="text-blue-600 font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 hover:text-blue-600 transition-colors"
        >
          Home
        </a>
        <a
          routerLink="/hotels"
          routerLinkActive="text-blue-600 font-semibold"
          class="text-gray-600 hover:text-blue-600 transition-colors"
        >
          Hotels
        </a>
        <a
          routerLink="/bookings"
          routerLinkActive="text-blue-600 font-semibold"
          class="text-gray-600 hover:text-blue-600 transition-colors"
        >
          Bookings
        </a>
      </div>

      <!-- CTA Button / User Icon -->
      <div class="hidden md:flex items-center">
        <!-- User Icon (when logged in) -->
        <a
          *ngIf="isUserLoggedIn()"
          routerLink="/profile"
          routerLinkActive="text-blue-600"
          class="flex items-center space-x-2 text-gray-600 hover:text-blue-600 transition-colors"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </a>

        <!-- Sign In Button (when not logged in) -->
        <a
          *ngIf="!isUserLoggedIn()"
          routerLink="/sign-in"
          class="bg-blue-600 text-white hover:bg-blue-700 px-5 py-2 rounded-lg font-medium transition-colors"
        >
          Sign In
        </a>
      </div>

      <!-- Mobile menu button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden text-gray-600 p-2 rounded-lg hover:bg-gray-100 transition-colors"
      >
        <svg
          class="h-6 w-6"
          [class.hidden]="isMenuOpen"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          class="h-6 w-6"
          [class.hidden]="!isMenuOpen"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div
      class="md:hidden py-3 border-t border-gray-200"
      [class.hidden]="!isMenuOpen"
    >
      <div class="flex flex-col space-y-1">
        <a
          routerLink="/"
          routerLinkActive="bg-blue-50 text-blue-600"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="toggleMenu()"
          class="text-gray-600 hover:bg-gray-50 px-4 py-3 rounded-lg transition-colors"
        >
          Home
        </a>
        <a
          routerLink="/hotels"
          routerLinkActive="bg-blue-50 text-blue-600"
          (click)="toggleMenu()"
          class="text-gray-600 hover:bg-gray-50 px-4 py-3 rounded-lg transition-colors"
        >
          Hotels
        </a>
        <a
          routerLink="/bookings"
          routerLinkActive="bg-blue-50 text-blue-600"
          (click)="toggleMenu()"
          class="text-gray-600 hover:bg-gray-50 px-4 py-3 rounded-lg transition-colors"
        >
          Bookings
        </a>

        <!-- User Profile Link (when logged in) -->
        <a
          *ngIf="isUserLoggedIn()"
          routerLink="/profile"
          routerLinkActive="bg-blue-50 text-blue-600"
          (click)="toggleMenu()"
          class="text-gray-600 hover:bg-gray-50 px-4 py-3 rounded-lg transition-colors flex items-center gap-2"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          Profile
        </a>

        <!-- Sign In Button (when not logged in) -->
        <a
          *ngIf="!isUserLoggedIn()"
          routerLink="/sign-in"
          (click)="toggleMenu()"
          class="bg-blue-600 text-white hover:bg-blue-700 px-4 py-3 rounded-lg font-medium transition-colors mt-2"
        >
          Sign In
        </a>
      </div>
    </div>
  </div>
</nav>
