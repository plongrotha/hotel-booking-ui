<div
  class="min-h-screen flex items-center justify-center bg-linear-to-br from-blue-50 to-indigo-100 py-12 px-4"
>
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h1>
      <p class="text-gray-600">Sign in to your account</p>
    </div>

    <!-- Sign In Form -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <!-- Error Message -->
      <div
        *ngIf="errorMessage"
        class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg"
      >
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>

      <form
        id="sign-in-form"
        [formGroup]="signInForm"
        (ngSubmit)="onSubmit()"
        class="space-y-5"
      >
        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Username</label
          >
          <input
            id="username-input"
            type="text"
            formControlName="username"
            placeholder="username"
            class="w-full px-4 py-3 border rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [ngClass]="{
              'border-red-500': username?.invalid && username?.touched,
              'border-gray-300': !username?.invalid || !username?.touched
            }"
          />
          <div *ngIf="username?.invalid && username?.touched" class="mt-1">
            <p
              *ngIf="username?.errors?.['required']"
              class="text-xs text-red-600"
            >
              Username cannot be empty
            </p>
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-gray-700"
              >Password</label
            >
            <a href="#" class="text-sm text-blue-600 hover:text-blue-700"
              >Forgot?</a
            >
          </div>
          <div class="relative">
            <input
              id="password-input"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              class="w-full px-4 py-3 border rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12"
              [ngClass]="{
                'border-red-500': password?.invalid && password?.touched,
                'border-gray-300': !password?.invalid || !password?.touched
              }"
            />
            <button
              id="toggle-password-btn"
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            >
              <svg
                *ngIf="!showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
              <svg
                *ngIf="showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                />
              </svg>
            </button>
          </div>
          <div *ngIf="password?.invalid && password?.touched" class="mt-1">
            <p
              *ngIf="password?.errors?.['required']"
              class="text-xs text-red-600"
            >
              Password cannot be empty
            </p>
            <p
              *ngIf="password?.errors?.['minlength']"
              class="text-xs text-red-600"
            >
              Password must be at least 6 characters long
            </p>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center">
          <input
            id="rememberMe"
            type="checkbox"
            [(ngModel)]="rememberMe"
            [ngModelOptions]="{ standalone: true }"
            class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
          />
          <label for="rememberMe" class="ml-2 text-sm text-gray-700"
            >Remember me</label
          >
        </div>

        <!-- Submit Button -->
        <app-button
          id="sign-in-submit-btn"
          type="submit"
          variant="primary"
          size="large"
          [disabled]="signInForm.invalid"
          [loading]="isLoading"
          [fullWidth]="true"
        >
          {{ isLoading ? "Signing In..." : "Sign In" }}
        </app-button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">or continue with</span>
        </div>
      </div>

      <!-- Social Sign In -->
      <div class="grid grid-cols-2 gap-3">
        <app-button
          id="google-signin-btn"
          type="button"
          variant="secondary"
          size="medium"
        >
          <div class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            <span class="text-sm font-medium text-gray-700">Google</span>
          </div>
        </app-button>
        <app-button
          id="facebook-signin-btn"
          type="button"
          variant="secondary"
          size="medium"
        >
          <div class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
            <span class="text-sm font-medium text-gray-700">Facebook</span>
          </div>
        </app-button>
      </div>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">
          Don't have an account?
          <a
            id="signup-link"
            routerLink="/sign-up"
            class="text-blue-600 hover:text-blue-700 font-medium"
            >Sign Up</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
