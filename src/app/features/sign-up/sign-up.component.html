<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 py-12 px-4"
>
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
      <p class="text-gray-600">Sign up to start booking hotels</p>
    </div>

    <!-- Sign Up Form -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <!-- Error Message -->
      <div
        *ngIf="errorMessage"
        class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg"
      >
        <p class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>

      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Full Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Full Name</label
          >
          <input
            type="text"
            formControlName="username"
            placeholder="John Doe"
            class="w-full px-4 py-3 border rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [ngClass]="{
              'border-red-500': username?.invalid && username?.touched,
              'border-gray-300': !username?.invalid || !username?.touched
            }"
          />
          <div *ngIf="username?.invalid && username?.touched" class="mt-1">
            <p
              *ngIf="username?.errors?.['required']"
              class="text-xs text-red-600"
            >
              Username cannot be empty
            </p>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2"
            >Password</label
          >
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              class="w-full px-4 py-3 border rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent pr-12"
              [ngClass]="{
                'border-red-500': password?.invalid && password?.touched,
                'border-gray-300': !password?.invalid || !password?.touched
              }"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
            >
              <svg
                *ngIf="!showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
              <svg
                *ngIf="showPassword"
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                />
              </svg>
            </button>
          </div>
          <div *ngIf="password?.invalid && password?.touched" class="mt-1">
            <p
              *ngIf="password?.errors?.['required']"
              class="text-xs text-red-600"
            >
              Password cannot be empty
            </p>
            <p
              *ngIf="password?.errors?.['minlength']"
              class="text-xs text-red-600"
            >
              Password must be at least 6 characters long
            </p>
          </div>
        </div>

        <!-- Confirm Password -->

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading || signUpForm.invalid"
          class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold text-lg hover:bg-blue-700 transition-colors shadow-md hover:shadow-lg disabled:bg-blue-400 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isLoading">Sign Up</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg
              class="animate-spin h-5 w-5 mr-2"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Signing Up...
          </span>
        </button>
      </form>

      <!-- Sign In Link -->
      <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">
          Already have an account?
          <a
            routerLink="/sign-in"
            class="text-blue-600 hover:text-blue-700 font-medium"
            >Sign In</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
