<!-- Simple MVP Design -->
<div class="min-h-screen bg-gray-50">
  <!-- Hero Section with Search -->
  <section class="bg-white py-12">
    <div class="container mx-auto px-4 max-w-5xl">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-3">Book Your Hotel</h1>
        <p class="text-gray-600 text-lg">Simple, fast, and reliable</p>
      </div>

      <!-- Simplified Search -->
      <div
        class="bg-white rounded-lg shadow-lg border border-gray-200 p-6 max-w-2xl mx-auto"
      >
        <form (ngSubmit)="onSearch()" class="space-y-4">
          <div>
            <input
              type="text"
              [(ngModel)]="searchData.destination"
              name="destination"
              placeholder="Where do you want to go?"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <input
              type="date"
              [(ngModel)]="searchData.checkIn"
              name="checkIn"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            <input
              type="date"
              [(ngModel)]="searchData.checkOut"
              name="checkOut"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-base focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors text-lg"
          >
            Search Hotels
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Tourist Attractions in Cambodia -->
  <section class="py-12">
    <div class="container mx-auto px-4 max-w-5xl">
      <h2 class="text-2xl font-bold text-gray-900 mb-6">
        Explore Cambodia's Top Tourist Attractions
      </h2>

      <!-- Tourist Attractions Grid -->
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        <div
          *ngFor="let attraction of touristAttractions"
          class="bg-white rounded-lg overflow-hidden shadow hover:shadow-xl transition-shadow border border-gray-200"
        >
          <!-- Attraction Image -->
          <div class="relative h-48">
            <img
              [src]="attraction.image"
              [alt]="attraction.name"
              class="w-full h-full object-cover"
            />
            <div class="absolute top-3 right-3">
              <span
                class="bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full"
              >
                {{ attraction.category }}
              </span>
            </div>
          </div>

          <!-- Attraction Details -->
          <div class="p-4">
            <h3 class="text-lg font-bold text-gray-900 mb-1">
              {{ attraction.name }}
            </h3>
            <p class="text-gray-600 text-sm mb-2 flex items-center">
              <svg
                class="w-4 h-4 mr-1"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                ></path>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                ></path>
              </svg>
              {{ attraction.location }}
            </p>
            <p class="text-gray-700 text-sm mb-3">
              {{ attraction.description }}
            </p>
            <div
              class="flex justify-between items-center pt-3 border-t border-gray-100"
            >
              <span class="text-xs text-gray-500">
                <svg
                  class="w-4 h-4 inline mr-1"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                  ></path>
                </svg>
                {{ attraction.visitors }}
              </span>
              <button
                class="text-blue-600 hover:text-blue-700 text-sm font-semibold"
              >
                Learn More →
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
